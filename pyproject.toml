[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "openwfn"
version = "0.7.2"
description = "Research-grade Gaussian wavefunction analysis with CLI, Python API, reports, and an offline workbench"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [{ name = "Muhammed Shah Shaji" }]
keywords = [
    "computational chemistry",
    "gaussian",
    "geometry",
    "molecular modeling",
    "quantum chemistry",
    "wavefunction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.7,<4",
    "numpy>=1.20.0",
    "questionary>=2.1,<3",
    "rich>=13.7,<16",
]

[project.urls]
Homepage = "https://github.com/sha786muhammed/openWFN"
Repository = "https://github.com/sha786muhammed/openWFN"
Issues = "https://github.com/sha786muhammed/openWFN/issues"


[project.scripts]
openwfn = "openwfn.cli:main"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]
test = [
    "build",
    "pytest",
    "pytest-cov",
    "ruff>=0.12,<1",
    "tomli>=2.0; python_version < '3.11'",
    "twine",
]

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openwfn = ["assets/*.js"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docs: tests that require the documentation toolchain",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_validation.py" = ["E402"]
"src/openwfn/commands.py" = ["E741"]
"src/openwfn/geometry.py" = ["E741"]
