name: Bug report
description: Report reproducible software behavior that is incorrect or unexpected
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach confidential calculations, credentials, or proprietary binary checkpoint files.
  - type: input
    id: version
    attributes:
      label: openWFN version
      placeholder: "0.8.0a2"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and operating-system versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact command or Python snippet and a permission-cleared fixture when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and complete error
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed private paths, credentials, and confidential research data.
          required: true
