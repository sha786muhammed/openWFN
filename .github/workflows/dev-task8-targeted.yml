name: Dev Task 8 targeted
on:
  push:
    branches: [work/0.9-task8-active]
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,interop]"
      - run: python -m pytest tests/validation/test_interop_format_contract.py -q
