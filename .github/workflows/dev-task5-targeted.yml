name: Dev Task 5 targeted
on:
  push:
    branches: [work/0.9-task5-active]
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,interop]"
      - run: python -m pytest tests/parsers/test_iodata_adapter.py tests/unit/test_capabilities.py -q
