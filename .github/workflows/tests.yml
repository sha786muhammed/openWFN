name: Tests and quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python scripts/check_repository.py --root .
      - run: ruff check src tests scripts
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python scripts/check_repository.py --root .
      - run: python -m pytest --strict-markers -m "not docs"
  platform-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest --strict-markers tests/cli tests/integration
      - run: python -m pip install -e ".[interop]"
      - run: python -m openwfn.cli tests/fixtures/interop/molden/water.molden capabilities
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,interop]"
      - run: python -m pytest tests/parsers/test_iodata_adapter.py tests/integration/test_interop_python_api.py tests/cli/test_capabilities_command.py tests/validation/test_interop_format_contract.py tests/validation/test_cross_format_equivalence.py tests/unit/test_orbital_cubes.py tests/integration/test_everyday_cross_format.py -q
      - run: python scripts/run_interop_validation.py
  optional-interfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,interop,outputs,mcp]"
      - run: python -m pytest --strict-markers tests/test_mcp_server.py tests/test_output_properties.py tests/integration/test_everyday_qc_parity.py tests/unit/test_mayer.py -q
  scientific-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: python scripts/run_validation.py
      - run: python scripts/run_external_benchmarks.py --repository-only --output-dir /tmp/openwfn-external-validation
  everyday-reference-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,interop,outputs]" pyscf==2.12.1
      - run: python -m pytest tests/validation/test_everyday_pyscf.py tests/validation/test_experimental_esp.py tests/validation/test_real_example_corpus.py tests/validation/test_coulomb_high_l.py -q
  resource-safety:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,resources,interop]"
      - run: python -m pytest tests/unit/test_resource_budget.py tests/unit/test_streaming_cube.py tests/unit/test_ao_chunk_budget.py -q
      - if: runner.os == 'Linux'
        run: python scripts/benchmark_resources.py --output resource-report.json
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-report
          path: resource-report.json
          if-no-files-found: warn
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv wheel-test
      - run: wheel-test/bin/python -m pip install dist/*.whl
      - run: wheel-test/bin/python -c "import importlib.util; assert importlib.util.find_spec('iodata') is None"
      - run: wheel-test/bin/openwfn --version
      - run: wheel-test/bin/openwfn examples install installed-examples
      - run: wheel-test/bin/openwfn --format json --output summary.json installed-examples/water.fchk summary
      - run: wheel-test/bin/openwfn installed-examples/water.fchk orbitals frontier
      - run: wheel-test/bin/openwfn installed-examples/water.fchk report build report.html
      - run: wheel-test/bin/openwfn installed-examples/water.fchk workbench workbench.html > workbench.txt
      - run: |
          wheel-test/bin/python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("summary.json").read_text())
          assert data["status"] == "success"
          assert data["data"]["formula"] == "H2O"
          report = Path("report.html").read_text()
          workbench = Path("workbench.html").read_text()
          workbench_output = Path("workbench.txt").read_text()
          assert "http://" not in report and "https://" not in report
          assert "Molecular rendering: 3Dmol.js (BSD-3-Clause)" in workbench
          assert "Status: Stable" in workbench_output
          assert '<script src="http' not in workbench
          assert "<script src='http" not in workbench
          PY
      - run: wheel-test/bin/python scripts/benchmark_batch.py --count 20 --workers 2 --workspace wheel-benchmark --output wheel-benchmark.json
  interop-wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv interop-wheel-test
      - run: |
          wheel_file=$(find dist -name '*.whl' -print -quit)
          interop-wheel-test/bin/python -m pip install "${wheel_file}[interop]"
      - run: interop-wheel-test/bin/openwfn tests/fixtures/interop/molden/water.molden capabilities
      - run: |
          interop-wheel-test/bin/python - <<'PY'
          from pathlib import Path
          from openwfn.ingest import load_input
          data = load_input(Path('tests/fixtures/interop/molden/water.molden'))
          assert data.provenance.backend == 'iodata'
          assert data.provenance.backend_version == '1.0.1'
          PY
