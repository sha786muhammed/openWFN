name: Apply clean Hirshfeld contract fix

on:
  push:
    branches:
      - feat/0.11-hirshfeld

permissions:
  contents: write

jobs:
  patch-clean-branch:
    if: github.repository == 'sha786muhammed/openWFN' && github.ref == 'refs/heads/feat/0.11-hirshfeld'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean active branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/0.11-hirshfeld-clean
          fetch-depth: 0

      - name: Apply exact compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact anchor, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/openwfn/services.py",
              "from .analysis.density import density_matrix_for_kind, evaluate_density, integrate_density\n"
              "from .analysis.hirshfeld import HirshfeldSettings, hirshfeld_population\n"
              "from .analysis.electrostatics import electronic_esp_from_grid, nuclear_esp, point_charge_esp\n"
              "from .analysis.grids import iter_point_chunks, molecular_grid_points, scalar_grid\n",
              "from .analysis.density import density_matrix_for_kind, evaluate_density, integrate_density\n"
              "from .analysis.electrostatics import electronic_esp_from_grid, nuclear_esp, point_charge_esp\n"
              "from .analysis.grids import iter_point_chunks, molecular_grid_points, scalar_grid\n"
              "from .analysis.hirshfeld import HirshfeldSettings, hirshfeld_population\n",
          )

          replace_once(
              "docs/reference/python-api.md",
              "| `frontier-all` | Alpha and beta frontiers plus the true overall HOMO for unrestricted calculations |\n"
              "| `mayer` | Experimental spin-corrected Mayer bond orders |\n",
              "| `frontier-all` | Alpha and beta frontiers plus the true overall HOMO for unrestricted calculations |\n"
              "| `hirshfeld` | Experimental native neutral-pro-atom Hirshfeld populations and charges for supported H/C/N/O all-electron wavefunctions |\n"
              "| `mayer` | Experimental spin-corrected Mayer bond orders |\n",
          )

          replace_once(
              "tests/integration/test_python_api.py",
              "with pytest.raises(ValueError, match=\"population method must be 'mulliken' or 'lowdin'\"):",
              "with pytest.raises(\n"
              "        ValueError,\n"
              "        match=\"population method must be 'mulliken', 'lowdin', or 'hirshfeld'\",\n"
              "    ):",
          )
          PY
          python -m compileall -q src/openwfn
          git diff --check

      - name: Commit to clean active branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/openwfn/services.py docs/reference/python-api.md tests/integration/test_python_api.py
          git commit -m "fix: align Hirshfeld public interface contracts"
          git push origin HEAD:feat/0.11-hirshfeld-clean

      - name: Remove helper workflow from old branch
        if: always()
        run: |
          git fetch origin feat/0.11-hirshfeld
          git switch -C feat/0.11-hirshfeld origin/feat/0.11-hirshfeld
          if test -f .github/workflows/_apply-clean-hirshfeld-contract-fix.yml; then
            git rm .github/workflows/_apply-clean-hirshfeld-contract-fix.yml
            git commit -m "chore: remove clean Hirshfeld contract helper"
            git push origin HEAD:feat/0.11-hirshfeld
          fi
