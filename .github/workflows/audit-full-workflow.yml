name: Full workflow audit (throwaway)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install openWFN audit environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,docs]"
      - name: Fetch pinned external benchmark inputs
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/openwfn-audit-inputs"
          mkdir -p "$ROOT"

          git init "$ROOT/iodata"
          git -C "$ROOT/iodata" remote add origin https://github.com/theochem/iodata.git
          git -C "$ROOT/iodata" fetch --depth 1 origin 9f7e800fc414b086d677b5f2882dd0c1dfa919f3
          git -C "$ROOT/iodata" checkout --detach FETCH_HEAD

          git init "$ROOT/QuickFF"
          git -C "$ROOT/QuickFF" remote add origin https://github.com/molmod/QuickFF.git
          git -C "$ROOT/QuickFF" fetch --depth 1 origin 40292b7cbc1b7b295dcf1310266a922f455ae8c8
          git -C "$ROOT/QuickFF" checkout --detach FETCH_HEAD
      - name: Run all independent external benchmarks
        id: external
        continue-on-error: true
        run: |
          python scripts/run_external_benchmarks.py \
            --input-root "$RUNNER_TEMP/openwfn-audit-inputs" \
            --output-dir audit-results/external
      - name: Run full public workflow matrix
        id: workflows
        continue-on-error: true
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/audit_full_workflows.py \
            --input-root "$RUNNER_TEMP/openwfn-audit-inputs" \
            --output-dir audit-results/workflows
      - name: Run focused scientific edge cases
        id: targeted
        continue-on-error: true
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/audit_targeted_scientific_edges.py \
            --input-root "$RUNNER_TEMP/openwfn-audit-inputs" \
            --output-dir audit-results/targeted
      - name: Print audit evidence
        if: always()
        shell: bash
        run: |
          echo '=== independent benchmarks ==='
          cat audit-results/external/report.md || true
          echo '=== workflow matrix ==='
          cat audit-results/workflows/workflow-audit.md || true
          echo '=== targeted scientific edge cases ==='
          cat audit-results/targeted/targeted-audit.md || true
      - name: Enforce post-fix audit result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          external = json.loads(Path("audit-results/external/results.json").read_text())
          workflow = json.loads(Path("audit-results/workflows/workflow-audit.json").read_text())
          targeted = json.loads(Path("audit-results/targeted/targeted-audit.json").read_text())

          problems = []
          if external["summary"]["failed"]:
              problems.append(f"external failures: {external['summary']['failed']}")

          workflow_failures = {
              item["name"]: item
              for item in workflow["entries"]
              if item["status"] == "failed"
          }
          expected_workflow = {
              "frontier-uhf-beta",
              "structure-only-summary-rejected",
          }
          if set(workflow_failures) != expected_workflow:
              problems.append(
                  "unexpected workflow failures: "
                  + repr(sorted(set(workflow_failures) - expected_workflow))
                  + "; missing known harness mismatches: "
                  + repr(sorted(expected_workflow - set(workflow_failures)))
              )
          beta = workflow_failures.get("frontier-uhf-beta", {})
          if beta.get("returncode") != 1 or "Beta orbitals are not available" not in beta.get("stderr_tail", ""):
              problems.append("RHF beta-channel rejection did not match the expected DataUnavailable behavior")
          structure = workflow_failures.get("structure-only-summary-rejected", {})
          if structure.get("returncode") != 0:
              problems.append("structure-only summary did not succeed as expected")

          targeted_failures = {
              item["name"]: item
              for item in targeted["findings"]
              if item["status"] == "failed"
          }
          expected_targeted = {
              f"posthf-{method}-{surface}-warning"
              for method in ("mp2", "mp3", "ci")
              for surface in ("population", "density", "esp")
          }
          if set(targeted_failures) != expected_targeted:
              problems.append(
                  "unexpected targeted failures: "
                  + repr(sorted(set(targeted_failures) - expected_targeted))
                  + "; missing known keyword mismatches: "
                  + repr(sorted(expected_targeted - set(targeted_failures)))
              )
          for name, item in targeted_failures.items():
              detail = item.get("detail", "").lower()
              if "scf density" not in detail or "post-scf" not in detail:
                  problems.append(f"{name} did not contain the required SCF/post-SCF provenance warning")

          if problems:
              raise SystemExit("; ".join(problems))
          print(
              "Post-fix audit passed: independent benchmarks have zero failures; "
              "all product workflow/edge failures are resolved; remaining raw failures are verified stale harness expectations."
          )
          PY
