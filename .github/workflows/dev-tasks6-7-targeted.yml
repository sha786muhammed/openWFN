name: Dev Tasks 6-7 targeted
on:
  push:
    branches: [work/0.9-tasks6-7-active]
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work/0.9-tasks6-7-active
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,interop]"
      - run: python scripts/dev_patch_task6.py
      - run: python scripts/dev_patch_task7.py
      - run: git diff --check
      - run: >-
          python -m pytest
          tests/integration/test_interop_python_api.py
          tests/integration/test_python_api.py
          tests/integration/test_mixed_format_batch.py
          tests/cli/test_capabilities_command.py
          tests/parsers/test_iodata_adapter.py
          tests/unit/test_capabilities.py
          tests/unit/test_analysis_registry.py
          -q
      - name: Persist verified Task 6-7 patches
        shell: bash
        run: |
          if ! git diff --quiet -- src/openwfn/cli.py src/openwfn/batch.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/openwfn/cli.py src/openwfn/batch.py
            git commit -m "feat: support capability-aware mixed-format workflows"
            git push origin HEAD:work/0.9-tasks6-7-active
          fi
  core-missing-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work/0.9-tasks6-7-active
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python scripts/dev_patch_task7.py
      - run: >-
          python -m pytest
          tests/integration/test_mixed_format_batch.py::test_process_pool_missing_backend_isolated_to_backend_record
          -q
