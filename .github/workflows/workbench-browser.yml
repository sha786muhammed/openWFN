name: Offline workbench browser validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-real-molecules:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Includes Chromium and system-dependency installation.
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[interop]" playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/validate_workbench_browser.py --output-dir /tmp/openwfn-browser-validation
      - run: cat /tmp/openwfn-browser-validation/report.json
