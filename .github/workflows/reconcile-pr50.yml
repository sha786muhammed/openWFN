name: Reconcile PR 50 with current main

on:
  push:
    branches:
      - feat/excited-states-uvvis

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/excited-states-uvvis
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge current main conservatively
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            git rm -f .github/workflows/reconcile-pr50.yml
            git commit -m "chore: remove completed reconciliation workflow"
            git push origin HEAD:feat/excited-states-uvvis
            exit 0
          fi
          git merge --no-commit -X theirs origin/main
          git rm -f .github/workflows/reconcile-pr50.yml
          git commit -m "merge: reconcile excited states with current main"
          git push origin HEAD:feat/excited-states-uvvis
