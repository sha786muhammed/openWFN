name: One-shot Hirshfeld interface patch

on:
  push:
    branches:
      - feat/0.11-hirshfeld

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'sha786muhammed/openWFN' && github.ref == 'refs/heads/feat/0.11-hirshfeld'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/0.11-hirshfeld
          fetch-depth: 0

      - name: Apply exact-anchor patch
        run: |
          python scripts/_apply_hirshfeld_interfaces.py
          python -m compileall -q src/openwfn
          git diff --check

      - name: Remove one-shot machinery and commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_hirshfeld-interface-patch.yml scripts/_apply_hirshfeld_interfaces.py
          git add src/openwfn/services.py src/openwfn/analysis/registry.py src/openwfn/api.py src/openwfn/cli.py src/openwfn/interactive.py tests/unit/test_analysis_registry.py
          if git diff --cached --quiet; then
            echo "No patch changes were produced" >&2
            exit 1
          fi
          git commit -m "feat: expose Hirshfeld through public interfaces"
          git push origin HEAD:feat/0.11-hirshfeld
