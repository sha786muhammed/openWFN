name: Hirshfeld reference bootstrap
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: hirshfeld-bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate-reference-library:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
      - id: source
        shell: bash
        run: |
          if [[ -f src/openwfn/reference_data/hirshfeld/v1/manifest.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.source.outputs.exists != 'true'
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.source.outputs.exists != 'true'
        run: python -m pip install numpy==2.5.3 pyscf==2.12.1
      - if: steps.source.outputs.exists != 'true'
        name: Generate verified references
        shell: bash
        run: python scripts/generate_hirshfeld_references.py --output-dir generated-hirshfeld-v1
      - if: success() && steps.source.outputs.exists != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hirshfeld-proatoms-v1-commit-source
          path: generated-hirshfeld-v1
          if-no-files-found: error
      - if: success() && steps.source.outputs.exists != 'true'
        name: Commit exact generated reference bytes
        shell: bash
        run: |
          mkdir -p src/openwfn/reference_data/hirshfeld/v1
          cp generated-hirshfeld-v1/H.npz src/openwfn/reference_data/hirshfeld/v1/H.npz
          cp generated-hirshfeld-v1/C.npz src/openwfn/reference_data/hirshfeld/v1/C.npz
          cp generated-hirshfeld-v1/N.npz src/openwfn/reference_data/hirshfeld/v1/N.npz
          cp generated-hirshfeld-v1/O.npz src/openwfn/reference_data/hirshfeld/v1/O.npz
          cp generated-hirshfeld-v1/manifest.json src/openwfn/reference_data/hirshfeld/v1/manifest.json
          git add src/openwfn/reference_data/hirshfeld/v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: add reproducible Hirshfeld proatom references"
          git push origin "HEAD:${{ github.head_ref }}"
