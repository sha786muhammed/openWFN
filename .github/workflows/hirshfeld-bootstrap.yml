name: Hirshfeld reference bootstrap
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hirshfeld-bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate-reference-library:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install numpy pyscf==2.12.1
      - name: Generate references with captured diagnostics
        shell: bash
        run: |
          set +e
          python scripts/generate_hirshfeld_references.py --output-dir generated-hirshfeld-v1 > generator.log 2>&1
          status=$?
          cat generator.log
          echo "$status" > generator.exitcode
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hirshfeld-generator-diagnostics
          path: |
            generator.log
            generator.exitcode
          if-no-files-found: error
      - if: success()
        uses: actions/upload-artifact@ea165f8d65b540449e92b4886f43607fa02
        with:
          name: hirshfeld-proatoms-v1
          path: generated-hirshfeld-v1
          if-no-files-found: error
