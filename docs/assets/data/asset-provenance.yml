assets:
  openwfn-brand.svg:
    source: Canonical openWFN brand plate composed from the original compact header mark
    license: MIT project asset
    transformation: The original compact mark is embedded without redrawing on a permanent navy background so the same logo remains legible in website headers, content, GitHub light mode, and GitHub dark mode
    alt: openWFN
  openwfn-icon.svg:
    source: Compact icon crop from the canonical openWFN header artwork
    license: MIT project asset
    transformation: The orbital symbol from the original compact mark is embedded without redrawing on the same permanent navy background for browser-tab use
    alt: openWFN orbital symbol
  openwfn-orbital-hero.webp:
    source: Generated specifically for the openWFN documentation redesign
    license: MIT project asset
    transformation: Generated from the approved Scholarly Handbook direction, reviewed, resized, converted to WebP, and stripped of metadata; retained as an archived project illustration but not used as branding
    alt: Translucent red-orange and blue molecular orbital lobes surrounding a small ball-and-stick molecule
  openwfn-wordmark.png:
    source: Original generated openWFN Molecular Signal wordmark
    license: MIT project asset
    transformation: Generated from the approved Molecular Signal direction; retained as an archived asset while the compact header mark is the canonical public logo
    alt: openWFN — Wavefunction Analysis
  openwfn-header.png:
    source: Original generated openWFN Compact Molecular Signal header mark
    license: MIT project asset
    transformation: Generated from the approved header concept, background removed, tightly cropped, resized, exported with transparency, and adopted as the single canonical project logo
    alt: openWFN
