site_name: openWFN
site_author: Muhammed Shah Shaji
site_description: Unified wavefunction post-processing for reproducible computational chemistry
site_url: https://sha786muhammed.github.io/openWFN/
repo_url: https://github.com/sha786muhammed/openWFN
repo_name: sha786muhammed/openWFN
theme:
  name: material
  language: en
  logo: assets/images/openwfn-brand.svg
  favicon: assets/images/openwfn-icon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.code.select
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
plugins:
  - search
extra_css:
  - stylesheets/openwfn-site-v2.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Get Started:
      - Overview: start/index.md
      - Installation: installation.md
      - Your first analysis: start/first-analysis.md
      - Quick start: quick-start.md
      - Learning paths: start/learning-paths.md
      - Core terminology: start/terminology.md
  - User Guide:
      - Foundations:
          - What is wavefunction analysis?: learn/wavefunction-analysis.md
          - Anatomy of FCHK: learn/fchk-anatomy.md
          - Reproducible research: learn/reproducibility.md
      - CLI workflows: guides/cli-workflows.md
      - Python workflows: guides/python-workflows.md
      - Batch and reports: guides/batch-and-reports.md
      - Experimental workbench: workbench.md
      - Troubleshooting: guides/troubleshooting.md
      - Tutorials:
          - Geometry: tutorials/geometry.md
          - Orbitals and density: tutorials/orbitals-density.md
          - Reports: tutorials/reports.md
  - Reference:
      - Complete CLI: reference/cli.md
      - Python API: reference/python-api.md
      - Formats, units, and exports: reference/formats-and-exports.md
  - Science:
      - Geometry and topology: science/geometry-topology.md
      - Orbitals and density: science/orbitals-density.md
      - Population and ESP: science/population-esp.md
      - Validation status: science/validation-status.md
      - Validation summary: validation.md
      - Methods overview: methods.md
      - Limitations: limitations.md
  - Project:
      - Citation: citation.md
      - Security and privacy: project/security.md
      - Contributing: project/contributing.md
      - Release history: project/release-history.md
      - Product boundary and benchmarking: project/core-benchmarking-design.md
      - Releasing: releasing.md
      - Releases:
          - Version 0.8.0a1: releases/0.8.0a1.md
          - Version 0.7.2: releases/0.7.2.md
          - Version 0.7.1: releases/0.7.1.md
          - Version 0.7.0: releases/0.7.0.md
